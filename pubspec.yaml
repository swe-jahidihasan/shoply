  omni_datetime_picker: ^2.3.2
  intl: ^0.20.3
  timelines_plus: ^1.0.1
  lucide_flutter: ^1.25.00
  sticky_headers: ^0.3.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
