publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  get: ^4.7.3
  google_fonts: ^8.2.1
  flutter_screenutil: ^5.9.3
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.4.1
  smooth_page_indicator: ^2.0.1
